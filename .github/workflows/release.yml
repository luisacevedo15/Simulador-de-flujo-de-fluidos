name: Compilar y Publicar Instalador

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión para compilar (si se deja vacío usa VERSION_APP de ui/constantes.py)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Instalador Windows
    runs-on: windows-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        env:
          QT_QPA_PLATFORM: offscreen
        # test_golden usa rel_tol=1e-12/abs_tol=0.0 sobre coeficientes ~1e-11 de polyfit sensibles al CPU/BLAS de la VM;
        # test_navegacion_rapida y test_decodifica_pausa_busca_repite_y_libera_video dependen de tiempos de frame en VM compartida.
        run: python -m pytest -q --ignore=tests/test_golden.py -k "not test_navegacion_rapida_conserva_efectos_y_termina_en_vista_actual and not test_decodifica_pausa_busca_repite_y_libera_video"

      - name: Determinar versión
        id: version
        shell: pwsh
        run: |
          $verConst = (python -c "from ui.constantes import VERSION_APP; print(VERSION_APP)").Trim()
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $ver = "${{ github.event.inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($ver)) { $ver = $verConst }
          }
          echo "app_version=$ver" >> $env:GITHUB_OUTPUT

      - name: Compilar aplicación con PyInstaller (--onedir)
        run: python build_exe.py

      # ------------------------------------------------------------------
      # FIRMA DIGITAL GRATUITA PARA OPEN SOURCE (SignPath.io)
      # Una vez aprobada tu solicitud en https://signpath.org/open-source:
      # 1. Agrega SIGNPATH_API_TOKEN y SIGNPATH_ORG_ID en Settings > Secrets.
      # 2. Firma primero dist/Simulador_Flujo_de_Fluidos/Simulador_Flujo_de_Fluidos.exe
      #    y después dist/installer/Simulador_Flujo_de_Fluidos_Setup.exe usando
      #    signpath/github-action-submit-signing-request@v1.
      # ------------------------------------------------------------------

      - name: Generar instalador con Inno Setup
        shell: pwsh
        run: |
          $candidatos = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe",
            "${env:LOCALAPPDATA}\Programs\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements
            $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "No se pudo instalar o encontrar Inno Setup 6 (ISCC.exe)"
          }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.app_version }}" instalador.iss
          $setupPath = "dist/installer/Simulador_Flujo_de_Fluidos_Setup.exe"
          $hash = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$setupPath.sha256" -Value "$hash  Simulador_Flujo_de_Fluidos_Setup.exe" -Encoding ascii

      - name: Generar paquete MSIX para Microsoft Store
        env:
          QT_QPA_PLATFORM: offscreen
        run: python build_msix.py "${{ steps.version.outputs.app_version }}"

      - name: Subir artefactos (Instalador + SHA256 + MSIX)
        uses: actions/upload-artifact@v4
        with:
          name: Simulador_Flujo_de_Fluidos_Instaladores
          path: |
            dist/installer/Simulador_Flujo_de_Fluidos_Setup.exe
            dist/installer/Simulador_Flujo_de_Fluidos_Setup.exe.sha256
            dist/store/*.msix

      - name: Publicar Release en GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Simulador_Flujo_de_Fluidos_Setup.exe
            dist/installer/Simulador_Flujo_de_Fluidos_Setup.exe.sha256
          generate_release_notes: true
